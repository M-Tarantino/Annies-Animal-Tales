title: "Annie's Animal Tales"
description: "Erlebnisse, Pflege-Tipps und redaktionelle Alltagsberichte aus dem Tierleben"
baseurl: "/Annies-Animal-Tales"
url: "https://m-tarantino.github.io/Annies-Animal-Tales"
author: "Annie"
language: de

source: .
destination: _site

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

markdown: kramdown
kramdown:
  input: GFM

collections:
  posts:
    output: true
    permalink: /:slug/
  kindergeschichten:
    output: true
    permalink: /kindergeschichten/:slug/
  posts_en:
    output: true
    permalink: /en/archive/:slug/
  kindergeschichten_en:
    output: true
    permalink: /en/stories/:slug/

defaults:
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
      lang: de

  - scope:
      path: "_kindergeschichten"
      type: kindergeschichten
    values:
      layout: story
      lang: de

  - scope:
      path: "_posts_en"
      type: posts_en
    values:
      layout: post
      lang: en

  - scope:
      path: "_kindergeschichten_en"
      type: kindergeschichten_en
    values:
      layout: story
      lang: en

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

liquid:
  error_mode: strict

sass:
  style: compressed