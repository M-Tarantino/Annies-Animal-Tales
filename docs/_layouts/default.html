<!-- docs/_layouts/default.html (Language Switcher mit Dropdown) -->
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🐾</text></svg>">
  <style>
    .lang-dropdown { position: relative; display: inline-block; }
    .lang-toggle { padding: 8px 16px; background: none; border: 1px solid #8a5a3b; border-radius: 6px; cursor: pointer; font-weight: 600; color: #8a5a3b; display: flex; align-items: center; gap: 6px; transition: all 0.3s; }
    .lang-toggle:hover { background: #8a5a3b; color: white; }
    .lang-menu { display: none; position: absolute; top: 100%; right: 0; background: white; border: 1px solid #ddd; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 1000; min-width: 120px; }
    .lang-dropdown.active .lang-menu { display: block; }
    .lang-option { display: block; width: 100%; padding: 12px 16px; background: none; border: none; text-align: left; cursor: pointer; color: #333; transition: all 0.2s; }
    .lang-option:hover { background: #f5ead9; color: #8a5a3b; font-weight: 600; }
    .lang-option.active { background: #8a5a3b; color: white; font-weight: 600; }
  </style>
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <div class="nav-container">
        <a href="{{ '/' | relative_url }}" class="nav-logo">🐾 {{ site.title }}</a>
        <ul class="nav-menu">
          <li><a href="{{ '/' | relative_url }}">Startseite</a></li>
          <li><a href="{{ '/archive/' | relative_url }}">Blog</a></li>
          <li><a href="{{ '/kindergeschichten/' | relative_url }}">Kindergeschichten</a></li>
        </ul>
        <div class="lang-dropdown" id="langDropdown">
          <button class="lang-toggle" onclick="toggleLangMenu()">🌐 <span id="langLabel">DE</span></button>
          <div class="lang-menu">
            <button class="lang-option active" onclick="switchLanguage('de')">🇩🇪 Deutsch</button>
            <button class="lang-option" onclick="switchLanguage('en')">🇬🇧 English</button>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="main-content">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="footer-content">
      <p>&copy; 2026 {{ site.title }}. Alle Rechte vorbehalten.</p>
      <div class="footer-links">
        <a href="{{ '/impressum/' | relative_url }}">Impressum</a>
        <a href="{{ '/datenschutz/' | relative_url }}">Datenschutzerklärung</a>
        <a href="{{ '/admin.html' | relative_url }}" class="login-btn">🔐 Admin</a>
      </div>
    </div>
  </footer>

  <script>
function toggleLangMenu() {
  const dropdown = document.getElementById('langDropdown');
  dropdown.classList.toggle('active');
}

function switchLanguage(lang) {
  // Sprache in localStorage speichern
  localStorage.setItem('blog-lang', lang);
  
  // Dropdown schließen
  document.getElementById('langDropdown').classList.remove('active');
  
  // Label aktualisieren
  document.getElementById('langLabel').textContent = lang === 'de' ? 'DE' : 'EN';
  
  // Buttons aktualisieren
  document.querySelectorAll('.lang-option').forEach(btn => {
    btn.classList.remove('active');
  });
  event.target.classList.add('active');
  
  // Seite neu laden mit Sprache als Parameter
  const currentLang = document.documentElement.lang;
  if (lang !== currentLang) {
    // Locale-Cookie setzen
    document.cookie = `blog_lang=${lang}; path=/; max-age=31536000`;
    location.reload();
  }
}

// Sprache beim Laden laden
window.addEventListener('DOMContentLoaded', () => {
  const savedLang = localStorage.getItem('blog-lang') || 'de';
  document.getElementById('langLabel').textContent = savedLang === 'de' ? 'DE' : 'EN';
  
  const buttons = document.querySelectorAll('.lang-option');
  buttons.forEach(btn => {
    if ((savedLang === 'de' && btn.textContent.includes('Deutsch')) ||
        (savedLang === 'en' && btn.textContent.includes('English'))) {
      btn.classList.add('active');
    }
  });
});

// Dropdown schließen beim Klick außerhalb
document.addEventListener('click', (e) => {
  const dropdown = document.getElementById('langDropdown');
  if (!dropdown.contains(e.target)) {
    dropdown.classList.remove('active');
  }
});
  </script>
</body>
</html>
