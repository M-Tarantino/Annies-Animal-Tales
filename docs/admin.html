permalink: /admin.html

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annie's Animal Tales Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5ead9; color: #333; min-height: 100vh; padding: 20px; }
    .admin-container { max-width: 900px; margin: 0 auto; }
    .admin-header { text-align: center; margin-bottom: 40px; }
    .admin-header h1 { color: #8a5a3b; font-size: 32px; margin-bottom: 8px; }
    .back-link { display: inline-block; margin-top: 12px; padding: 8px 16px; background: #e8dcc8; color: #8a5a3b; text-decoration: none; border-radius: 6px; font-weight: 500; transition: all 0.3s; }
    .back-link:hover { background: #8a5a3b; color: white; }
    .auth-section { background: white; padding: 24px; border-radius: 16px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .auth-form { display: flex; gap: 12px; flex-wrap: wrap; }
    .auth-form input { flex: 1; min-width: 200px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
    .auth-form button { padding: 12px 24px; background: #8a5a3b; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .auth-form button:hover { background: #5c3b26; }
    .editor-section { display: none; }
    .editor-section.active { display: block; }
    .editor-form { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 24px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #8a5a3b; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 14px; }
    .form-group textarea { min-height: 300px; font-family: "Georgia", serif; }
    .editor-toolbar { background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px 8px 0 0; padding: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    .toolbar-btn { padding: 8px 12px; background: white; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; font-weight: 500; color: #333; }
    .toolbar-btn:hover { background: #8a5a3b; color: white; border-color: #8a5a3b; }
    .toolbar-sep { width: 1px; background: #ddd; }
    .form-submit { background: #8a5a3b; color: white; padding: 14px 28px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 16px; width: 100%; }
    .form-submit:hover { background: #5c3b26; }
    .status-message { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; }
    .status-message.show { display: block; }
    .status-message.success { background: #e8f5e9; color: #2e7d32; }
    .status-message.error { background: #ffebee; color: #c62828; }
    .status-message.loading { background: #e3f2fd; color: #1565c0; }
    .type-select { max-width: 300px; }
    .upload-section { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    .file-input-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; }
    .file-input-wrapper input[type=file] { position: absolute; left: -9999px; }
    .file-input-label { display: block; padding: 12px; background: white; border: 2px dashed #8a5a3b; border-radius: 8px; text-align: center; cursor: pointer; color: #8a5a3b; font-weight: 600; transition: all 0.3s; }
    .file-input-label:hover { background: #f5ead9; }
    .image-preview { max-width: 150px; max-height: 150px; border-radius: 8px; border: 2px solid #8a5a3b; display: none; }
    .image-preview.show { display: block; }
    .upload-status { font-size: 12px; margin-top: 8px; padding: 8px; border-radius: 6px; display: none; }
    .upload-status.show { display: block; }
    .upload-status.success { background: #e8f5e9; color: #2e7d32; }
    .upload-status.error { background: #ffebee; color: #c62828; }
    .upload-status.loading { background: #e3f2fd; color: #1565c0; }
    @media (max-width: 599px) {
      .admin-header h1 { font-size: 22px; }
      .auth-form { flex-direction: column; }
      .auth-form input, .auth-form button { width: 100%; }
      .editor-toolbar { gap: 4px; }
      .toolbar-btn { padding: 6px 8px; font-size: 12px; }
      .upload-section { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <h1>🐾 Annie's Animal Tales Admin</h1>
      <a href="./" class="back-link">← Zurück zur Startseite</a>
      <p>Schreib deine Beiträge — sie werden automatisch veröffentlicht.</p>
    </div>

    <div class="auth-section">
      <h2 style="color: #8a5a3b; margin-bottom: 16px;">🔐 Authentifizierung</h2>
      <div class="auth-form">
        <input type="password" id="patInput" placeholder="GitHub Personal Access Token" autocomplete="off">
        <button onclick="authenticateWithPAT()">Login</button>
      </div>
      <div id="authStatus" style="display: none; margin-top: 12px; padding: 12px; border-radius: 8px;"></div>
    </div>

    <div class="editor-section" id="editorSection">
      <form class="editor-form" id="postForm" onsubmit="submitPost(event)">
        <div class="form-group type-select">
          <label for="postType">Beitragstyp *</label>
          <select id="postType" required onchange="updatePostType()">
            <option value="">-- Wähle einen Typ --</option>
            <option value="blog">📝 Blogpost</option>
            <option value="story">📖 Kindergeschichte</option>
          </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label for="title">Titel *</label>
            <input type="text" id="title" required placeholder="z.B. Warum Katzen Kartons lieben">
          </div>
          <div class="form-group">
            <label for="publishDate">Datum *</label>
            <input type="date" id="publishDate" required>
          </div>
        </div>

        <div class="form-group">
          <label for="description">Beschreibung / Vorschau *</label>
          <input type="text" id="description" required placeholder="Kurzer Text für die Vorschau">
        </div>

        <div class="form-group">
          <label>Vorschaubild</label>
          <div class="upload-section">
            <div class="file-input-wrapper" id="uploadWrapper">
              <input type="file" id="imageFile" accept="image/*" onchange="handleFileSelect(event)">
              <label class="file-input-label" for="imageFile">📁 Bild auswählen</label>
            </div>
            <div>
              <img id="imagePreview" class="image-preview" alt="Vorschau">
              <div id="uploadStatus" class="upload-status"></div>
            </div>
          </div>
          <input type="hidden" id="image" placeholder="/assets/images/beispiel.jpg">
          <small style="display: block; margin-top: 8px; color: #666;">Oder direkt Pfad eingeben: /assets/images/beispiel.jpg</small>
        </div>

        <div class="form-group">
          <label for="content">Inhalt *</label>
          <div class="editor-toolbar">
            <button type="button" class="toolbar-btn" title="Fett" onclick="formatText('bold')"><b>B</b></button>
            <button type="button" class="toolbar-btn" title="Kursiv" onclick="formatText('italic')"><i>I</i></button>
            <button type="button" class="toolbar-btn" title="Unterstrichen" onclick="formatText('underline')" style="text-decoration: underline;">U</button>
            <div class="toolbar-sep"></div>
            <button type="button" class="toolbar-btn" title="Überschrift 1" onclick="formatText('heading1')">H1</button>
            <button type="button" class="toolbar-btn" title="Überschrift 2" onclick="formatText('heading2')">H2</button>
            <div class="toolbar-sep"></div>
            <button type="button" class="toolbar-btn" title="Link" onclick="insertLink()">🔗</button>
            <button type="button" class="toolbar-btn" title="Liste" onclick="formatText('unorderedList')">• Liste</button>
            <button type="button" class="toolbar-btn" title="Löschen" onclick="clearText()" style="color: #c62828;">✕ Löschen</button>
          </div>
          <textarea id="content" required placeholder="Schreibe hier deinen Beitrag..."></textarea>
        </div>

        <div class="form-group">
          <label for="tags">Tags (komma-getrennt)</label>
          <input type="text" id="tags" placeholder="z.B. Hunde, Pflege, Erlebnisse">
        </div>

        <button type="submit" class="form-submit">📤 Veröffentlichen</button>
        <div id="submitStatus" class="status-message"></div>
      </form>
    </div>
  </div>

  <script>
const CONFIG = {
  owner: "M-Tarantino",
  repo: "Annies-Animal-Tales",
  branch: "main"
};

let authToken = null;

function authenticateWithPAT() {
  const pat = document.getElementById("patInput").value.trim();
  if (!pat) {
    showAuthStatus("Bitte Token eintragen", "error");
    return;
  }
  authToken = pat;
  testAuth();
}

function testAuth() {
  const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}`;
  fetch(url, {
    headers: { 
      "Authorization": `token ${authToken}`, 
      "Accept": "application/vnd.github.v3+json" 
    }
  })
    .then(r => r.json())
    .then(data => {
      if (data.id) {
        showAuthStatus("✓ Authentifiziert als " + data.owner.login, "success");
        document.getElementById("editorSection").classList.add("active");
        document.getElementById("patInput").disabled = true;
        document.querySelector(".auth-form button").disabled = true;
        initializePublishDate();
      } else {
        showAuthStatus("Ungültiger Token: " + (data.message || "unbekannter Fehler"), "error");
        authToken = null;
      }
    })
    .catch(e => {
      showAuthStatus("Fehler: " + e.message, "error");
      authToken = null;
    });
}

function showAuthStatus(msg, type) {
  const el = document.getElementById("authStatus");
  el.textContent = msg;
  el.className = type;
  el.style.display = "block";
}

function initializePublishDate() {
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, "0");
  const dd = String(today.getDate()).padStart(2, "0");
  document.getElementById("publishDate").value = `${yyyy}-${mm}-${dd}`;
}

function updatePostType() {
  const type = document.getElementById("postType").value;
  if (type === "story") {
    document.getElementById("description").placeholder = "Kurze Geschichte-Zusammenfassung...";
  } else if (type === "blog") {
    document.getElementById("description").placeholder = "Blog-Vorschau...";
  }
}

function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;

  if (!authToken) {
    showUploadStatus("Bitte erst authentifizieren", "error");
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    const preview = document.getElementById("imagePreview");
    preview.src = e.target.result;
    preview.classList.add("show");
  };
  reader.readAsDataURL(file);

  showUploadStatus("Wird hochgeladen...", "loading");
  uploadFile(file);
}

function uploadFile(file) {
  const filename = file.name.toLowerCase().replace(/[^a-z0-9.-]/g, "-");
  const path = `docs/assets/images/${filename}`;
  const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`;

  const reader = new FileReader();
  reader.onload = (e) => {
    const base64 = e.target.result.split(",")[1];
    
    fetch(url, {
      method: "PUT",
      headers: {
        "Authorization": `token ${authToken}`,
        "Accept": "application/vnd.github.v3+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: `Bild hochgeladen: ${filename}`,
        content: base64,
        branch: CONFIG.branch
      })
    })
      .then(r => r.json())
      .then(data => {
        if (data.content) {
          const imagePath = `/assets/images/${filename}`;
          document.getElementById("image").value = imagePath;
          showUploadStatus("✓ Hochgeladen: " + filename, "success");
        } else {
          showUploadStatus("Fehler: " + (data.message || "Upload fehlgeschlagen"), "error");
        }
      })
      .catch(e => showUploadStatus("Fehler: " + e.message, "error"));
  };
  reader.readAsArrayBuffer(file);
}

function showUploadStatus(msg, type) {
  const el = document.getElementById("uploadStatus");
  el.textContent = msg;
  el.className = `upload-status show ${type}`;
}

function formatText(cmd) {
  const textarea = document.getElementById("content");
  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  const selected = textarea.value.substring(start, end) || "Text";
  const before = textarea.value.substring(0, start);
  const after = textarea.value.substring(end);

  let formatted = selected;
  switch (cmd) {
    case "bold":
      formatted = `**${selected}**`;
      break;
    case "italic":
      formatted = `*${selected}*`;
      break;
    case "underline":
      formatted = `__${selected}__`;
      break;
    case "heading1":
      formatted = `\n# ${selected}\n`;
      break;
    case "heading2":
      formatted = `\n## ${selected}\n`;
      break;
    case "unorderedList":
      formatted = `\n- ${selected}\n`;
      break;
  }

  textarea.value = before + formatted + after;
  textarea.focus();
  textarea.selectionStart = start + formatted.length;
}

function insertLink() {
  const url = prompt("Link-URL eingeben:");
  if (!url) return;
  const text = prompt("Link-Text eingeben:", "Hier klicken") || "Hier klicken";
  const textarea = document.getElementById("content");
  const start = textarea.selectionStart;
  const before = textarea.value.substring(0, start);
  const after = textarea.value.substring(start);
  textarea.value = before + `[${text}](${url})` + after;
  textarea.focus();
}

function clearText() {
  if (confirm("Wirklich alles löschen?")) {
    document.getElementById("content").value = "";
  }
}

function submitPost(event) {
  event.preventDefault();

  if (!authToken) {
    showSubmitStatus("Nicht authentifiziert", "error");
    return;
  }

  const postType = document.getElementById("postType").value;
  if (!postType) {
    showSubmitStatus("Bitte Beitragstyp wählen", "error");
    return;
  }

  const title = document.getElementById("title").value.trim();
  const publishDate = document.getElementById("publishDate").value;
  const description = document.getElementById("description").value.trim();
  const imagePath = document.getElementById("image").value.trim();
  const content = document.getElementById("content").value.trim();
  const tags = document.getElementById("tags").value.split(",").map(t => t.trim()).filter(Boolean);

  if (!title || !publishDate || !description || !content) {
    showSubmitStatus("Alle Pflichtfelder ausfüllen", "error");
    return;
  }

  showSubmitStatus("Wird veröffentlicht...", "loading");

  const frontmatter = {
    title,
    date: publishDate,
    author: "Annie",
    description,
    ...(imagePath && { image: imagePath }),
    tags,
    lang: "de"
  };

  const markdown = `---\n${Object.entries(frontmatter).map(([key, val]) => {
    if (Array.isArray(val)) return `${key}: [${val.map(v => `"${v}"`).join(", ")}]`;
    if (typeof val === "string") return `${key}: "${val}"`;
    return `${key}: ${val}`;
  }).join("\n")}\n---\n\n${content}`;

  const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, "-");
  const filename = `${publishDate}-${slug}.md`;
  const folder = postType === "blog" ? "_posts" : "_kindergeschichten";
  const path = `docs/${folder}/${filename}`;

  commitFile(path, markdown)
    .then(() => {
      showSubmitStatus("✓ Veröffentlicht!", "success");
      document.getElementById("postForm").reset();
      document.getElementById("imagePreview").classList.remove("show");
    })
    .catch(err => showSubmitStatus(`Fehler: ${err}`, "error"));
}

function commitFile(path, content) {
  const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`;
  const encodedContent = btoa(unescape(encodeURIComponent(content)));

  return fetch(url, {
    method: "PUT",
    headers: {
      "Authorization": `token ${authToken}`,
      "Accept": "application/vnd.github.v3+json",
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      message: `Neue Veröffentlichung: ${path.split("/").pop()}`,
      content: encodedContent,
      branch: CONFIG.branch
    })
  }).then(r => r.json().then(data => {
    if (!r.ok) throw new Error(data.message || `HTTP ${r.status}`);
    return data;
  }));
}

function showSubmitStatus(msg, type) {
  const el = document.getElementById("submitStatus");
  el.textContent = msg;
  el.className = `status-message show ${type}`;
}
  </script>
</body>
</html>
